services:
  - type: web
    name: katavi-ekilimo-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CACHE_MAX_KEYS
        value: "5000"
      - key: USSD_SERVICE_CODE
        sync: false
      - key: USSD_SUPPORT_PHONE
        sync: false
      - key: PAYMENT_CALLBACK_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: PORT
        value: 10000
